[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[build.environment]
  # Prevent secrets from being exposed in build
  SECRETS_SCAN_ENABLED = "true"
  # Only use OPENROUTER_API_KEY (without VITE_ prefix) for server-side
  # Do NOT set VITE_OPENROUTER_API_KEY - it would expose the key in client code

[[headers]]
  for = "/*"
    [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/storage/v1/object/public/media/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[prerender]
crawl = true